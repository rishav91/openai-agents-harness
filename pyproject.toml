[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-harness"
version = "0.0.1"
description = "Local Agents API equity research harness (Phase 0 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=3.13.0",
  "python-dotenv>=1.0.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
equity-harness = "equity_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
